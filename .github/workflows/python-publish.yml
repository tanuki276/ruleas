name: Publish to PyPI
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: pypi-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[test]"
      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as f:
              version = tomllib.load(f)['project']['version']
          assert os.environ['RELEASE_TAG'] in (version, 'v' + version), 'Release tag/version mismatch'
          PY
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel in clean environment and run examples
        run: |
          python -m venv /tmp/ruleas-release
          /tmp/ruleas-release/bin/pip install dist/*.whl
          cd /tmp
          /tmp/ruleas-release/bin/ruleas test "$GITHUB_WORKSPACE/examples/documents.rulea" "$GITHUB_WORKSPACE/examples/documents.cases.json"
          /tmp/ruleas-release/bin/python "$GITHUB_WORKSPACE/examples/run_example.py"
      - uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ruleas/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
