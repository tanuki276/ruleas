name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - run: ruleas check examples/documents.rulea
      - run: ruleas test examples/documents.rulea examples/documents.cases.json
  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Validate isolated wheel and sdist installs
        run: |
          for distribution in "$GITHUB_WORKSPACE"/dist/*; do
            python -m venv --clear /tmp/ruleas-check
            /tmp/ruleas-check/bin/pip install "$distribution"
            cd /tmp
            /tmp/ruleas-check/bin/ruleas test "$GITHUB_WORKSPACE/examples/documents.rulea" "$GITHUB_WORKSPACE/examples/documents.cases.json"
            /tmp/ruleas-check/bin/python "$GITHUB_WORKSPACE/examples/run_example.py"
            cd "$GITHUB_WORKSPACE"
          done

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ruleas
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: ruleas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ruleas"
          --health-interval 5s --health-retries 10
    env:
      RULEAS_TEST_DATABASE_URL: postgresql+psycopg://ruleas:test-password@localhost:5432/ruleas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[test]'
      - run: pytest -q tests/test_postgres.py
