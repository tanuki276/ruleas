<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ruleas 管理画面</title>
<style>body{font:16px system-ui;background:#f2f5f9;color:#17253c;margin:0}main{max-width:1100px;margin:32px auto;padding:24px}section{background:white;border:1px solid #d5deeb;border-radius:12px;padding:24px;margin:18px 0}input,textarea,select,button{font:inherit;padding:10px;margin:6px 0;box-sizing:border-box}textarea{width:100%;font-family:monospace}button{background:#224eaf;color:white;border:0;border-radius:5px;cursor:pointer;margin-right:8px}label{display:block}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef2f8;padding:16px}table{width:100%;text-align:left}td,th{padding:10px;border-bottom:1px solid #ddd}.ALLOW{color:#16803c}.DENY,.ERROR{color:#b62032}[hidden]{display:none!important}</style>
<main><h1>Ruleas <small>1.0.0</small></h1><p id="status" role="status"></p>
<section id="login"><h2>ログイン</h2><form id="loginform"><label>ユーザー名 <input id="username" autocomplete="username" required></label><label>パスワード <input id="password" type="password" autocomplete="current-password" required></label><button>ログイン</button></form></section>
<div id="workspace" hidden><p id="identity"></p><button id="logout">ログアウト</button><section><h2>ルール一覧</h2><button id="refresh">更新</button><button id="new" data-admin>新規作成</button><table><thead><tr><th>名前</th><th>namespace</th><th>version</th><th>有効</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></section>
<section><h2>ルール編集</h2><p id="selected">新規ポリシー</p><label>名前<input id="name" required></label><label>タグ（カンマ区切り）<input id="tags"></label><label><input id="enabled" type="checkbox" checked>有効</label><label>.rulea<textarea id="source" rows="14" spellcheck="false">rule example:
    when: age >= 18
    reason: "18歳以上が必要です"</textarea></label><button id="save" data-admin>保存</button><button id="delete" data-admin>削除</button><button id="download">.rulea をダウンロード</button><h3>バージョン履歴</h3><div id="versions"></div></section>
<section><h2>テスト実行</h2><label>rule / ruleset 名<input id="target" value="example"></label><label>context（JSON）<textarea id="context" rows="6">{"age": 20}</textarea></label><button id="run">実行</button><h3 id="result"></h3><pre id="decision">Decision / reason / trace がここに表示されます</pre></section>
<section data-admin><h2>API キー</h2><label>キー名<input id="keyname" value="API client"></label><button id="createkey">作成</button><pre id="newkey"></pre><div id="keys"></div></section>
<section data-admin><h2>ユーザー作成</h2><label>ユーザー名<input id="newuser"></label><label>パスワード<input id="newpassword" type="password" minlength="12"></label><label>権限<select id="role"><option value="viewer">閲覧者</option><option value="admin">管理者</option></select></label><button id="createuser">作成</button></section>
<section data-admin><h2>監査ログ</h2><button id="audit">取得</button><pre id="auditdata"></pre></section></div></main>
<script>
const $=id=>document.getElementById(id);let csrf='',current=null,policies=[],role='viewer';
async function api(path,method='GET',data){const r=await fetch('/v1/'+path,{method,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:data===undefined?undefined:JSON.stringify(data)});let v=await r.json();if(!r.ok)throw Error(typeof v.detail==='string'?v.detail:JSON.stringify(v.detail));return v}
function task(fn){return async e=>{if(e)e.preventDefault();try{await fn();$('status').textContent='完了'}catch(e){$('status').textContent=e.message}}}
async function start(me){csrf=me.csrf_token;role=me.role;$('login').hidden=true;$('workspace').hidden=false;$('identity').textContent=me.username+' / '+role;document.querySelectorAll('[data-admin]').forEach(e=>e.hidden=role!=='admin');await load();if(role==='admin')await loadkeys()}
function button(text,fn){let b=document.createElement('button');b.textContent=text;b.onclick=task(fn);return b}
async function load(){policies=await api('rules');$('rows').replaceChildren();for(const p of policies){let tr=document.createElement('tr');for(const v of [p.name,p.namespace,p.version,p.enabled?'有効':'無効']){let td=document.createElement('td');td.textContent=v;tr.append(td)}let td=document.createElement('td');td.append(button('開く',()=>open(p)));tr.append(td);$('rows').append(tr)}}
async function open(p){current=p;$('selected').textContent='ID '+p.id+' / 更新 '+p.updated_at;$('name').value=p.name;$('source').value=p.source;$('enabled').checked=p.enabled;$('tags').value=p.tags.join(', ');$('versions').replaceChildren();for(const v of await api('rules/'+p.id+'/versions')){let row=document.createElement('p');row.textContent='v'+v.version+' — '+v.actor+' — '+v.created_at;if(role==='admin')row.append(button('復元',async()=>{let restored=await api('rules/'+p.id+'/rollback/'+v.version,'POST');await load();await open(restored)}));$('versions').append(row)}}
$('loginform').onsubmit=task(async()=>{await start(await api('login','POST',{username:$('username').value,password:$('password').value}));$('password').value=''});
$('logout').onclick=task(async()=>{await api('logout','POST');location.reload()});$('refresh').onclick=task(load);
$('new').onclick=()=>{current=null;$('selected').textContent='新規ポリシー';$('name').value='';$('versions').replaceChildren()};
$('save').onclick=task(async()=>{const data={name:$('name').value,source:$('source').value,enabled:$('enabled').checked,tags:$('tags').value.split(',').map(s=>s.trim()).filter(Boolean),expected_version:current?.version};const p=await api(current?'rules/'+current.id:'rules',current?'PUT':'POST',data);await load();await open(p)});
$('delete').onclick=task(async()=>{if(!current)throw Error('ルールを選択してください');if(!confirm('このポリシーを削除しますか？'))return;await api('rules/'+current.id,'DELETE');current=null;await load();$('selected').textContent='削除済み';$('versions').replaceChildren()});
$('download').onclick=task(async()=>{if(!current)throw Error('ルールを選択してください');location.href='/v1/rules/'+current.id+'/source'});
$('run').onclick=task(async()=>{if(!current)throw Error('保存済みのルールを選択してください');const d=await api('decide','POST',{policy_id:current.id,rule:$('target').value,context:JSON.parse($('context').value)});$('result').textContent=d.result+' — '+d.reason;$('result').className=d.result;$('decision').textContent=JSON.stringify(d,null,2)});
async function loadkeys(){$('keys').replaceChildren();for(const k of await api('api-keys')){let row=document.createElement('p');row.textContent=k.name+' / '+(k.enabled?'有効':'無効');if(k.enabled)row.append(button('無効化',async()=>{await api('api-keys/'+k.id,'DELETE');await loadkeys()}));$('keys').append(row)}}
$('createkey').onclick=task(async()=>{let k=await api('api-keys','POST',{name:$('keyname').value});$('newkey').textContent='一度だけ表示されます: '+k.key;await loadkeys()});
$('createuser').onclick=task(async()=>{await api('users','POST',{username:$('newuser').value,password:$('newpassword').value,role:$('role').value});$('newpassword').value=''});
$('audit').onclick=task(async()=>{$('auditdata').textContent=JSON.stringify(await api('audit-logs'),null,2)});
api('me').then(start).catch(()=>{});
</script></html>
