[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ruleas"
version = "1.0.0"
description = "Ruleas: embeddable, safe and explainable decision language for Python"
authors = [
  { name="tanuki276" }
]
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]

[project.scripts]
ruleas = "rulea.cli:main"
rulea = "rulea.cli:main"

[project.urls]
Repository = "https://github.com/tanuki276/ruleas"

[tool.setuptools.packages.find]
include = ["rulea*"]
