[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rulease"
version = "2.0.0a1"
description = "Ruleas: authenticated policy API and management server"
dependencies = ["rulea>=2.1.0a1,<3", "pydantic-settings>=2.7,<3", "argon2-cffi>=23.1,<26", "fastapi>=0.121.1,<1", "pydantic>=2.7,<3", "alembic>=1.13,<2", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "itsdangerous>=2.2,<3"]
authors = [
  { name="tanuki276" }
]
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]

[project.scripts]
rulease = "rulease.cli:main"
ruleas = "rulease.cli:legacy_main"

[project.urls]
Repository = "https://github.com/tanuki276/ruleas"

[tool.setuptools.packages.find]
include = ["rulease*", "ruleas*"]

[tool.setuptools.package-data]
rulease = ["migrations/*.sql"]
ruleas = ["admin.html", "migrations/*.py", "migrations/versions/*.py"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "build", "twine"]
