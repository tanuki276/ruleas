[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ruleas"
version = "1.0.0"
description = "Ruleas: authenticated policy API and management server"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "itsdangerous>=2.2,<3"]
authors = [
  { name="tanuki276" }
]
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: Apache Software License"
]

[project.scripts]
ruleas = "ruleas.cli:main"
rulea = "rulea.cli:main"

[project.urls]
Repository = "https://github.com/tanuki276/ruleas"

[tool.setuptools.packages.find]
include = ["rulea*", "ruleas*"]

[tool.setuptools.package-data]
ruleas = ["admin.html"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "build", "twine"]
